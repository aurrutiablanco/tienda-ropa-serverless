<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Administración — ModaUSDT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a211e'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='700' font-size='20' fill='white'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Geist:wght@400;600;700&family=Geist+Mono:wght@400&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin">

    <div id="site-header"></div>

    <main>
        <div class="container page">
            <div class="section-head">
                <h1 class="h-lg">Inventario —</h1>
                <button class="btn btn-solid" type="button" id="btn-nuevo">Crear producto</button>
            </div>

            <div class="admin-bar">
                <div class="search">
                    <span class="search-icon" id="admin-search-icon"></span>
                    <label class="sr-only" for="admin-busqueda">Buscar en el inventario</label>
                    <input type="text" id="admin-busqueda" autocomplete="off" placeholder="Buscar por nombre, color o talla">
                </div>
                <div style="display:flex;align-items:center;gap:16px">
                    <p class="mono muted" id="admin-count" aria-live="polite"></p>
                    <label class="sr-only" for="admin-categoria">Filtrar por categoría</label>
                    <select class="select select-sm" id="admin-categoria">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Imagen</th>
                            <th scope="col">Producto</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Precio (USDT)</th>
                            <th scope="col">Color / Talla</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="7" class="table-empty">Cargando inventario...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Crear / editar producto -->
    <div class="modal" id="modal-producto" role="dialog" aria-modal="true" aria-labelledby="modal-prod-title">
        <div class="modal-content wide">
            <button class="modal-close" type="button" data-close-modal aria-label="Cerrar"><span id="admin-close-icon"></span></button>
            <h2 class="h-md" id="modal-prod-title">Crear producto</h2>
            <p class="muted small">Los campos marcados con * son obligatorios.</p>

            <form id="form-producto" novalidate>
                <input type="hidden" id="prod-id">

                <div class="field">
                    <label class="label" for="prod-nombre">Nombre *</label>
                    <input class="input" type="text" id="prod-nombre" required placeholder="Ej. Franela oversize de algodón">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="label" for="prod-precio">Precio (USDT) *</label>
                        <input class="input" type="number" id="prod-precio" step="0.01" min="0.01" required placeholder="15.00">
                    </div>
                    <div class="field">
                        <label class="label" for="prod-categoria">Categoría *</label>
                        <select class="select" id="prod-categoria" required></select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="label" for="prod-color">Color *</label>
                        <input class="input" type="text" id="prod-color" required placeholder="Ej. Negro">
                    </div>
                    <div class="field">
                        <label class="label" for="prod-talla">Talla *</label>
                        <input class="input" type="text" id="prod-talla" required placeholder="Ej. M">
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="prod-imagen">URL de la imagen</label>
                    <input class="input" type="url" id="prod-imagen" placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <div class="field">
                    <label class="label" for="prod-descripcion">Descripción</label>
                    <textarea class="textarea" id="prod-descripcion" rows="3" placeholder="Detalles de la prenda"></textarea>
                </div>

                <div class="field">
                    <label class="label" for="prod-estado">Estado</label>
                    <select class="select" id="prod-estado">
                        <option value="1">Disponible</option>
                        <option value="0">Agotado (oculto en la tienda)</option>
                    </select>
                </div>

                <p class="form-msg" id="prod-msg" role="alert"></p>
                <button class="btn btn-solid btn-block" type="submit" id="btn-guardar">Guardar producto</button>
            </form>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
